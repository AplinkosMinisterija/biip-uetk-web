name: Deploy to Staging

on:
  push:
    branches: [main]

jobs:
  deploy-staging:
    name: Deploy staging
    uses: AplinkosMinisterija/reusable-workflows/.github/workflows/biip-deploy.yml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      environment: Staging
      docker-image: ghcr.io/AplinkosMinisterija/biip-uetk-web
      cache-from: type=registry,ref=ghcr.io/aplinkosministerija/biip-uetk-web:buildcache
      cache-to: type=registry,ref=ghcr.io/aplinkosministerija/biip-uetk-web:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
      build-args: |
        NODE_ENV=production
        VITE_USER_NODE_ENV=staging
        VITE_SENTRY_ENV=staging
        VITE_SENTRY_DSN=https://e2494aceced346f6b08c57e7ec8769ae@sentry.biip.lt/12
        VITE_MAPS_HOST=https://staging-maps.biip.lt
      
